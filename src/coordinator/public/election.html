<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivian-Andrea — Topología de Elección</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <meta name="description" content="Dashboard de topología y elección del cluster distribuido con Algoritmo Bully">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="election.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <a href="/" class="back-btn">← Panel Principal</a>
        <div class="header-title">
            <span class="title-icon">🗳️</span>
            <div>
                <h1>Dashboard de Elección</h1>
                <span class="header-sub" id="hdr-algo">Algoritmo Bully</span>
            </div>
        </div>
        <div class="header-status">
            <div class="leader-badge" id="leader-badge">
                <span class="crown">👑</span>
                <span id="leader-id">—</span>
            </div>
            <div class="term-badge">Término <span id="term-val">—</span></div>
            <div id="splitbrain-alert" class="splitbrain-alert hidden">⚠️ SPLIT-BRAIN</div>
        </div>
    </header>

    <!-- MAIN -->
    <main class="election-main">

        <!-- TOPOLOGÍA SVG -->
        <section class="topo-section">
            <div class="section-title">
                🔗 Topología del Cluster
                <span class="badge-live">EN VIVO</span>
            </div>
            <div class="topo-container">
                <svg id="topo-svg" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                            <path d="M0,0 L0,6 L8,3 z" fill="rgba(124,107,255,0.5)" />
                        </marker>
                        <filter id="glow-leader">
                            <feGaussianBlur stdDeviation="4" result="coloredBlur" />
                            <feMerge>
                                <feMergeNode in="coloredBlur" />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                        <filter id="glow-node">
                            <feGaussianBlur stdDeviation="2" result="coloredBlur" />
                            <feMerge>
                                <feMergeNode in="coloredBlur" />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                    </defs>
                    <g id="topo-edges"></g>
                    <g id="topo-nodes"></g>
                </svg>
            </div>
        </section>

        <!-- PANEL DERECHO -->
        <aside class="side-panel">

            <!-- Estado del nodo actual -->
            <div class="side-card" id="card-self-state">
                <div class="side-card-title">📡 Este Nodo</div>
                <div class="state-grid">
                    <div class="state-row"><span class="state-label">ID</span><span class="state-val mono"
                            id="self-id">—</span></div>
                    <div class="state-row"><span class="state-label">Rol</span><span class="state-val"
                            id="self-role">—</span></div>
                    <div class="state-row"><span class="state-label">URL</span><span class="state-val mono url-cell"
                            id="self-url">—</span></div>
                    <div class="state-row"><span class="state-label">Líder</span><span class="state-val mono"
                            id="self-leader">—</span></div>
                    <div class="state-row"><span class="state-label">Uptime</span><span class="state-val mono"
                            id="self-uptime">—</span></div>
                </div>
            </div>

            <!-- Controles de Elección -->
            <div class="side-card">
                <div class="side-card-title">⚡ Controles</div>
                <div class="controls-grid">
                    <button class="ctrl-btn primary" onclick="triggerElection()">🗳️ Forzar Elección</button>
                    <button class="ctrl-btn warn" onclick="pauseNode()">🧊 Pausar Nodo</button>
                    <button class="ctrl-btn success" onclick="resumeNode()">▶️ Reanudar</button>
                    <button class="ctrl-btn danger" onclick="healAll()">🩹 Sanar Red</button>
                </div>
            </div>

            <!-- Inyección de Caos -->
            <div class="side-card">
                <div class="side-card-title">💥 Inyección de Caos</div>

                <div class="chaos-row">
                    <label class="chaos-label">Latencia (ms)</label>
                    <div class="chaos-input-row">
                        <input type="range" id="latency-slider" min="0" max="3000" step="50" value="0"
                            oninput="$('latency-val').textContent = this.value + 'ms'">
                        <span class="chaos-val mono" id="latency-val">0ms</span>
                    </div>
                    <button class="ctrl-btn sm primary" onclick="applyLatency()">Aplicar</button>
                </div>

                <div class="chaos-row">
                    <label class="chaos-label">Drop Rate (%)</label>
                    <div class="chaos-input-row">
                        <input type="range" id="droprate-slider" min="0" max="100" step="5" value="0"
                            oninput="$('droprate-val').textContent = this.value + '%'">
                        <span class="chaos-val mono" id="droprate-val">0%</span>
                    </div>
                    <button class="ctrl-btn sm danger" onclick="applyDropRate()">Aplicar</button>
                </div>

                <div class="chaos-row">
                    <label class="chaos-label">Aislar Peer (Partición)</label>
                    <div style="display:flex;gap:0.5rem">
                        <input type="text" id="partition-url" class="chaos-input" placeholder="http://localhost:3002">
                        <button class="ctrl-btn sm warn" onclick="applyPartition()">Aislar</button>
                    </div>
                </div>

                <!-- Estado de fallos -->
                <div class="faults-status" id="faults-status">
                    <div class="fault-badge paused" id="fault-paused" style="display:none">🧊 PAUSADO</div>
                    <div class="fault-badge drop" id="fault-drop" style="display:none">📉 DROP</div>
                    <div class="fault-badge latency" id="fault-latency" style="display:none">⏳ LATENCIA</div>
                </div>
            </div>

            <!-- Log de eventos -->
            <div class="side-card log-card">
                <div class="side-card-title">
                    📡 Eventos SSE
                    <button class="ctrl-btn sm ghost" onclick="clearLog()" style="margin-left:auto">✕</button>
                </div>
                <div class="log-feed" id="log-feed">
                    <div class="log-placeholder">Esperando eventos del cluster...</div>
                </div>
            </div>

        </aside>
    </main>

    <div id="toast-container" class="toast-container"></div>

    <script src="election.js"></script>
</body>

</html>
